message: Inventory Service STAGE Environment

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DB_URL}
    username: ${INVENTORY_DB_USERNAME}
    password: ${INVENTORY_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

grpc:
  server:
    port: ${INVENTORY_GRPC_PORT:9091}

product-service:
  base-url: ${PRODUCT_SERVICE_URI}

logging:
  level:
    root: INFO
    com.ecommerce.inventory: INFO
