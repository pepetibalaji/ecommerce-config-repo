message: Payment Service STAGE Environment

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

spring:
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${PAYMENT_KAFKA_CONSUMER_GROUP_ID:payment-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ecommerce.common.events.*
        spring.json.value.default.type: com.ecommerce.common.events.order.OrderCreatedEvent
        spring.json.use.type.headers: false
    producer:
      client-id: ${PAYMENT_KAFKA_PRODUCER_CLIENT_ID:payment-service-producer}
      acks: all
      retries: ${PAYMENT_KAFKA_PRODUCER_RETRIES:3}
      batch-size: ${PAYMENT_KAFKA_BATCH_SIZE:16384}
      buffer-memory: ${PAYMENT_KAFKA_BUFFER_MEMORY:33554432}
      compression-type: ${PAYMENT_KAFKA_COMPRESSION_TYPE:snappy}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${PAYMENT_KAFKA_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${PAYMENT_KAFKA_REQUEST_TIMEOUT_MS:30000}
        linger.ms: ${PAYMENT_KAFKA_LINGER_MS:5}

grpc:
  server:
    enabled: true
    port: ${PAYMENT_GRPC_PORT:9092}

payment:
  provider:
    active: ${PAYMENT_PROVIDER_ACTIVE:STRIPE}
    mode: ${PAYMENT_PROVIDER_MODE:test}
    refund-timeout-ms: ${PAYMENT_PROVIDER_REFUND_TIMEOUT_MS:5000}
    sandbox:
      enabled: false
    stripe:
      enabled: ${STRIPE_ENABLED:true}
      api-key: ${STRIPE_API_KEY}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET}
      previous-webhook-secrets: ${STRIPE_PREVIOUS_WEBHOOK_SECRETS:}
      staging-verified: ${STRIPE_STAGING_VERIFIED:false}
      timeout-ms: ${STRIPE_TIMEOUT_MS:5000}
    razorpay:
      enabled: false
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      timeout-ms: ${RAZORPAY_TIMEOUT_MS:5000}
  checkout:
    frontend-origins: ${PAYMENT_FRONTEND_ORIGINS}
    allowed-provider-hosts: [checkout.stripe.com]
    frontend-return-url: "${PAYMENT_FRONTEND_RETURN_URL}"
    success-url: "${PAYMENT_CHECKOUT_SUCCESS_URL}"
    cancel-url: "${PAYMENT_CHECKOUT_CANCEL_URL}"
  order-lookup:
    base-url: ${ORDER_SERVICE_URI}
    secret: ${PAYMENT_ORDER_LOOKUP_SECRET}
  outbox:
    poll-delay-ms: ${PAYMENT_OUTBOX_POLL_DELAY_MS:1000}
    batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE:25}
    max-attempts: ${PAYMENT_OUTBOX_MAX_ATTEMPTS:12}
    send-timeout-seconds: ${PAYMENT_OUTBOX_SEND_TIMEOUT_SECONDS:10}
  expiry:
    poll-delay-ms: ${PAYMENT_EXPIRY_POLL_DELAY_MS:15000}
  reconciliation:
    poll-delay-ms: ${PAYMENT_RECONCILIATION_POLL_DELAY_MS:60000}
  webhook:
    max-body-bytes: ${PAYMENT_WEBHOOK_MAX_BODY_BYTES:262144}
    stripe-requests-per-minute: ${PAYMENT_WEBHOOK_STRIPE_REQUESTS_PER_MINUTE:600}
    max-attempts: ${PAYMENT_WEBHOOK_MAX_ATTEMPTS:12}
    retry-delay-ms: ${PAYMENT_WEBHOOK_RETRY_DELAY_MS:5000}
  refunds:
    lease-seconds: ${PAYMENT_REFUND_LEASE_SECONDS:120}
    max-attempts: ${PAYMENT_REFUND_MAX_ATTEMPTS:10}
    retry-base-seconds: ${PAYMENT_REFUND_RETRY_BASE_SECONDS:30}
    batch-size: ${PAYMENT_REFUND_BATCH_SIZE:20}
    poll-delay-ms: ${PAYMENT_REFUND_POLL_DELAY_MS:5000}
  cancellations:
    poll-delay-ms: ${PAYMENT_CANCELLATION_POLL_DELAY_MS:5000}
  idempotency:
    key-prefix: ${PAYMENT_IDEMPOTENCY_KEY_PREFIX:payment}

logging:
  level:
    root: INFO
    com.ecommerce.payment: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
