server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/inventory_db?options=-c%20TimeZone=UTC
    username: ecommerce_user
    password: ecommerce_password

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8081}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}

grpc:
  server:
    port: 9091

springdoc:
  swagger-ui:
    path: /swagger-ui.html
