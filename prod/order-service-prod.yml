message: Order Service PROD Environment

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

spring:
  application.name: order-service
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ecommerce.common.events.*
        spring.json.use.type.headers: true
    listener:
      ack-mode: record
      observation-enabled: true
    template.observation-enabled: true
    producer:
      client-id: ${ORDER_KAFKA_PRODUCER_CLIENT_ID:order-service-producer}
      acks: all
      retries: ${ORDER_KAFKA_PRODUCER_RETRIES:3}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true

grpc:
  server.enabled: false
  clients.inventory:
    host: ${INVENTORY_GRPC_HOST}
    port: ${INVENTORY_GRPC_PORT:9091}
    deadline-ms: ${INVENTORY_GRPC_DEADLINE_MS:8000}
    plaintext: ${INVENTORY_GRPC_PLAINTEXT:false}

order:
  default-currency: ${ORDER_DEFAULT_CURRENCY:INR}
  payment-outcome-consumer-group: ${ORDER_PAYMENT_OUTCOME_CONSUMER_GROUP:order-service-payment-outcomes}
