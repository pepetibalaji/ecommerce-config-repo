message: Notification Service PROD Environment

server:
  port: ${NOTIFICATION_SERVICE_PORT:8088}
  shutdown: graceful

spring:
  application.name: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI}
  datasource:
    url: ${NOTIFICATION_DB_URL}
    username: ${NOTIFICATION_DB_USERNAME}
    password: ${NOTIFICATION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa.hibernate.ddl-auto: validate
  jpa.open-in-view: false
  jpa.properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    listener.ack-mode: record
    consumer:
      group-id: ${NOTIFICATION_KAFKA_CONSUMER_GROUP_ID:notification-service}
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

notification:
  auth-action-delivery:
    auth-base-url: ${AUTH_INTERNAL_BASE_URL}
    internal-service-token: ${AUTH_INTERNAL_SERVICE_TOKEN}
    verification-url: ${AUTH_EMAIL_VERIFICATION_URL}
    password-reset-url: ${AUTH_PASSWORD_RESET_URL}
    email-change-url: ${AUTH_EMAIL_CHANGE_URL}
  kafka.consumer-group: ${NOTIFICATION_KAFKA_CONSUMER_GROUP_ID:notification-service}
  max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
  retry-base-delay: ${NOTIFICATION_RETRY_BASE_DELAY:30s}
  delivery-poll-ms: ${NOTIFICATION_DELIVERY_POLL_MS:5000}
  provider: ${NOTIFICATION_EMAIL_PROVIDER}
  mailtrap:
    api-token: ${MAILTRAP_API_TOKEN}
    from-email: ${MAILTRAP_FROM_EMAIL}
    from-name: ${MAILTRAP_FROM_NAME:Ecommerce Platform}
  recipient-email-overrides: {}

management.endpoints.web.exposure.include: health,info,prometheus
