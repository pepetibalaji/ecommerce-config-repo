message: Cart Service DEV Environment

server:
  port: ${CART_SERVICE_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: cart-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

cart:
  ttl:
    days: ${CART_TTL_DAYS:7}

logging:
  level:
    root: INFO
    com.ecommerce.cart: INFO
    org.springframework.data.redis: INFO
