server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2000ms}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8081}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - SecureHeaders

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowed-origin-patterns:
                  - ${FRONTEND_ORIGIN:http://localhost:3000}
                  - ${FRONTEND_VITE_ORIGIN:http://localhost:5173}
                  - ${GATEWAY_ORIGIN:http://localhost:8080}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - Accept
                  - Origin
                  - X-Requested-With
                  - X-Correlation-Id
                  - traceparent
                  - tracestate
                exposed-headers:
                  - X-Correlation-Id
                  - traceparent
                  - X-Trace-Id
                allow-credentials: true
                max-age: 3600

          routes:
            # =====================================================
            # Auth Service - Public Auth APIs
            # =====================================================
            - id: auth-public-route
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/register,/api/v1/auth/login,/api/v1/auth/refresh
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_AUTH_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AUTH_BURST:20}
                    redis-rate-limiter.requestedTokens: 1

            # =====================================================
            # Auth Service - Protected Auth/User/Admin APIs
            # =====================================================
            - id: auth-protected-route
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/logout,/api/v1/users/**,/api/v1/admin/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_USER_REPLENISH:30}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_USER_BURST:60}
                    redis-rate-limiter.requestedTokens: 1

            # =====================================================
            # Auth Service - OAuth2 / JWK / Discovery APIs
            # =====================================================
            - id: auth-oauth-route
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/oauth2/**,/.well-known/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_AUTH_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AUTH_BURST:20}
                    redis-rate-limiter.requestedTokens: 1

            # =====================================================
            # Product Service - Public APIs
            # =====================================================
            - id: product-public-route
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_PRODUCT_REPLENISH:60}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_PRODUCT_BURST:120}
                    redis-rate-limiter.requestedTokens: 1

            # =====================================================
            # Product Service - Admin APIs
            # =====================================================
            - id: product-admin-route
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/admin/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_ADMIN_REPLENISH:20}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_ADMIN_BURST:40}
                    redis-rate-limiter.requestedTokens: 1

            # =====================================================
            # Inventory Service - Public/User APIs
            # =====================================================
            - id: inventory-route
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_INVENTORY_REPLENISH:30}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_INVENTORY_BURST:60}
                    redis-rate-limiter.requestedTokens: 1

            # =====================================================
            # Inventory Service - Admin APIs
            # =====================================================
            - id: inventory-admin-route
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/admin/inventory/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_ADMIN_REPLENISH:20}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_ADMIN_BURST:40}
                    redis-rate-limiter.requestedTokens: 1

            # =====================================================
            # Cart Service - User Shopping Cart APIs
            # =====================================================
            - id: cart-route
              uri: ${CART_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/cart/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_CART_REPLENISH:30}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_CART_BURST:60}
                    redis-rate-limiter.requestedTokens: 1

            # =====================================================
            # Order Service - Checkout and Booking APIs
            # =====================================================
            - id: order-route
              uri: ${ORDER_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_ORDER_REPLENISH:15}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_ORDER_BURST:30}
                    redis-rate-limiter.requestedTokens: 1

            # =====================================================
            # AUTOMATED OPENAPI/SWAGGER SPECIFICATION AGGREGATION ROUTES
            # =====================================================
            - id: auth-openapi-route
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/auth-service/v3/api-docs
              filters:
                - RewritePath=/auth-service/(?<path>.*), /$\\{path\\}

            - id: product-openapi-route
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/product-service/v3/api-docs
              filters:
                - RewritePath=/product-service/(?<path>.*), /$\\{path\\}

            - id: inventory-openapi-route
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/inventory-service/v3/api-docs
              filters:
                - RewritePath=/inventory-service/(?<path>.*), /$\\{path\\}

            - id: cart-openapi-route
              uri: ${CART_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/cart-service/v3/api-docs
              filters:
                - RewritePath=/cart-service/(?<path>.*), /$\\{path\\}

            - id: order-openapi-route
