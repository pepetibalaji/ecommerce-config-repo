server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2000ms}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8081}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - SecureHeaders

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowed-origin-patterns:
                  - ${FRONTEND_ORIGIN:http://localhost:3000}
                  - ${FRONTEND_VITE_ORIGIN:http://localhost:5173}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - Accept
                  - Origin
                  - X-Requested-With
                  - X-Correlation-Id
                  - traceparent
                  - tracestate
                exposed-headers:
                  - X-Correlation-Id
                  - traceparent
                allow-credentials: true
                max-age: 3600

          routes:
            - id: auth-public-route
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/register,/api/v1/auth/login,/api/v1/auth/refresh
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_AUTH_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AUTH_BURST:20}
                    redis-rate-limiter.requestedTokens: 1

            - id: auth-protected-route
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/logout,/api/v1/users/**,/api/v1/admin/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_USER_REPLENISH:30}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_USER_BURST:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: auth-oauth-route
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/oauth2/**,/.well-known/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_AUTH_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AUTH_BURST:20}
                    redis-rate-limiter.requestedTokens: 1

            - id: product-public-route
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_PRODUCT_REPLENISH:60}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_PRODUCT_BURST:120}
                    redis-rate-limiter.requestedTokens: 1

            - id: product-admin-route
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/admin/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_ADMIN_REPLENISH:20}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_ADMIN_BURST:40}
                    redis-rate-limiter.requestedTokens: 1

            - id: inventory-public-route
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8084}
