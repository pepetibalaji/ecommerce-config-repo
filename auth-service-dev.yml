server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ecommerce?options=-c%20TimeZone=UTC
    username: ecommerce_user
    password: ecommerce_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true # <-- Added this line to fix the error

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none

auth:
  token:
    access-ttl-minutes: 15
