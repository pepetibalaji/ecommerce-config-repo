server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ecommerce?options=-c%20TimeZone=Asia/Kolkata
    username: ecommerce_user
    password: ecommerce_password

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  jackson:
    time-zone: Asia/Kolkata
