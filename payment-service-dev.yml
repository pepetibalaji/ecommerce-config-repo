message: Payment Service DEV Environment

server:
  port: ${PAYMENT_SERVICE_PORT:8087}
  shutdown: graceful

spring:
  application:
    name: payment-service

  datasource:
    url: "{cipher}"
    username: "{cipher}fdfd1690e7f381bf2cf4c5ec3c9c1d48fb12bb74af6d7f1d82a8b080f7bf62fd"
    password: "{cipher}079b62ce6f7cf6f6b0e3d08c1711ce51ca7c82b034f94f1e11c8ad874415e6314492f5e5fb0422d69475991910cfa6c7"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

    listener:
      observation-enabled: true

    template:
      observation-enabled: true

    consumer:
      group-id: ${PAYMENT_KAFKA_CONSUMER_GROUP_ID:payment-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.ecommerce.common.events.*
        spring.json.value.default.type: com.ecommerce.common.events.order.OrderCreatedEvent
        spring.json.use.type.headers: false

    producer:
      client-id: ${PAYMENT_KAFKA_PRODUCER_CLIENT_ID:payment-service-producer}
      acks: all
      retries: ${PAYMENT_KAFKA_PRODUCER_RETRIES:3}
      batch-size: ${PAYMENT_KAFKA_BATCH_SIZE:16384}
      buffer-memory: ${PAYMENT_KAFKA_BUFFER_MEMORY:33554432}
      compression-type: ${PAYMENT_KAFKA_COMPRESSION_TYPE:snappy}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${PAYMENT_KAFKA_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${PAYMENT_KAFKA_REQUEST_TIMEOUT_MS:30000}
        linger.ms: ${PAYMENT_KAFKA_LINGER_MS:5}

grpc:
  server:
    enabled: true
    port: ${PAYMENT_GRPC_PORT:9092}

payment:
  provider:
    active: ${PAYMENT_PROVIDER_ACTIVE:STRIPE}
    mode: ${PAYMENT_PROVIDER_MODE:test}
    refund-timeout-ms: ${PAYMENT_PROVIDER_REFUND_TIMEOUT_MS:5000}

    sandbox:
      enabled: ${PAYMENT_SANDBOX_ENABLED:true}

    stripe:
      enabled: ${STRIPE_ENABLED:true}
      api-key: "{cipher}54b458b7cf9b90469eee2137d1bf6e9be59984df135dc5f80a7221ea581c71179c622e6441118d62408b255e058d75ef4d131f2e5e9e4c8ccff22a61edde3dfb77661d65ff01bb0966a68540fa8e174240dbd847eaa061242ce030324cc993132fcfab8750370529f35d10f6aa4807c2a8dbc5fa348087258135b967672645c1"
      webhook-secret: "{cipher}af09e4f3217ff517fff49b1cf90b2d83ea3de4c1d25e8bc22f4a7d9d6dd3e7b0f273829e46e4dd36506238ed0e1228aa5a1bc88bdc9d704b8bb80d5fb918a67f2d2cb27d602e13dd06da717452dd5b1d7c16463b1634a00af04f796b681fb2d8"
      timeout-ms: ${STRIPE_TIMEOUT_MS:5000}

    razorpay:
      enabled: ${RAZORPAY_ENABLED:false}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      timeout-ms: ${RAZORPAY_TIMEOUT_MS:5000}

  checkout:
    success-url: "${PAYMENT_CHECKOUT_SUCCESS_URL:http://localhost:8087/public/payments/success?orderId={ORDER_ID}&paymentId={PAYMENT_ID}}"
    cancel-url: "${PAYMENT_CHECKOUT_CANCEL_URL:http://localhost:8087/public/payments/cancel?orderId={ORDER_ID}&paymentId={PAYMENT_ID}}"

  idempotency:
    key-prefix: ${PAYMENT_IDEMPOTENCY_KEY_PREFIX:payment}

logging:
  level:
    root: INFO
    com.ecommerce.payment: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
