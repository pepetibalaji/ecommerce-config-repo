message: Payment Service DEV Environment

server:
  port: ${PAYMENT_SERVICE_PORT:8087}
  shutdown: graceful

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${PAYMENT_DB_NAME:payment_db}
    username: ${POSTGRES_USER:ecommerce_user}
    password: ${POSTGRES_PASSWORD:ecommerce_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

grpc:
  server:
    enabled: false
    port: ${PAYMENT_GRPC_PORT:9092}

payment:
  provider:
    active: ${PAYMENT_PROVIDER_ACTIVE:SANDBOX}
    mode: ${PAYMENT_PROVIDER_MODE:sandbox}

    sandbox:
      enabled: ${PAYMENT_SANDBOX_ENABLED:true}

    stripe:
      enabled: ${STRIPE_ENABLED:false}
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      timeout-ms: ${STRIPE_TIMEOUT_MS:5000}

    razorpay:
      enabled: ${RAZORPAY_ENABLED:false}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      timeout-ms: ${RAZORPAY_TIMEOUT_MS:5000}

  checkout:
    success-url: ${PAYMENT_CHECKOUT_SUCCESS_URL:http://localhost:3001/checkout/success?orderId={ORDER_ID}}
    cancel-url: ${PAYMENT_CHECKOUT_CANCEL_URL:http://localhost:3001/checkout/cancel?orderId={ORDER_ID}}

  idempotency:
    key-prefix: ${PAYMENT_IDEMPOTENCY_KEY_PREFIX:payment}

logging:
  level:
    root: INFO
    com.ecommerce.payment: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
