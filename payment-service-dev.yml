message: Payment Service DEV Environment

server:
  port: ${PAYMENT_SERVICE_PORT:8087}
  shutdown: graceful

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${PAYMENT_DB_NAME:payment_db}
    username: ${POSTGRES_USER:ecommerce_user}
    password: ${POSTGRES_PASSWORD:ecommerce_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

    listener:
      observation-enabled: true

    template:
      observation-enabled: true

    consumer:
      group-id: ${PAYMENT_KAFKA_CONSUMER_GROUP_ID:payment-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.ecommerce.common.events.*
        spring.json.value.default.type: com.ecommerce.common.events.order.OrderCreatedEvent
        spring.json.use.type.headers: false

    producer:
      client-id: ${PAYMENT_KAFKA_PRODUCER_CLIENT_ID:payment-service-producer}
      acks: all
      retries: ${PAYMENT_KAFKA_PRODUCER_RETRIES:3}
      batch-size: ${PAYMENT_KAFKA_BATCH_SIZE:16384}
      buffer-memory: ${PAYMENT_KAFKA_BUFFER_MEMORY:33554432}
      compression-type: ${PAYMENT_KAFKA_COMPRESSION_TYPE:snappy}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${PAYMENT_KAFKA_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${PAYMENT_KAFKA_REQUEST_TIMEOUT_MS:30000}
        linger.ms: ${PAYMENT_KAFKA_LINGER_MS:5}

grpc:
  server:
    enabled: true
    port: ${PAYMENT_GRPC_PORT:9092}

payment:
  provider:
    active: ${PAYMENT_PROVIDER_ACTIVE:STRIPE}
    mode: ${PAYMENT_PROVIDER_MODE:test}
    refund-timeout-ms: ${PAYMENT_PROVIDER_REFUND_TIMEOUT_MS:5000}

    sandbox:
      enabled: ${PAYMENT_SANDBOX_ENABLED:true}

    stripe:
      enabled: ${STRIPE_ENABLED:true}
      api-key: "{cipher}afad22320bb1a7c402b5a9e34aaac5613b7db19928a52242f4b6553bad60e62be1844b7a82e0626128005faea2bf7ba97060c19f11974a9c9bbff8fa0e6a87e0ee4bd665ef912af63d035a54c8a6d267643a8f91d210fd112ac9e3518032b506247a054cc6233674b2e5fc30d34c43df83b763d5e45a51266885757582c0cd27"
      webhook-secret: "{cipher}d97b0f53777827cd94e61949dac35c8f48722183366bb4093c600b49539f7546584b4a16a6e1a7a734308b0ed4999a199edba15d6951f63a2a5c22f6c0f53f8de7502c2f65d1c3c186037c3a9f1b0b12493dc4db7c34701774439636bcb455a4"
      timeout-ms: ${STRIPE_TIMEOUT_MS:5000}

    razorpay:
      enabled: ${RAZORPAY_ENABLED:false}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      timeout-ms: ${RAZORPAY_TIMEOUT_MS:5000}

  checkout:
    success-url: "${PAYMENT_CHECKOUT_SUCCESS_URL:http://localhost:8087/public/payments/success?orderId={ORDER_ID}&paymentId={PAYMENT_ID}}"
    cancel-url: "${PAYMENT_CHECKOUT_CANCEL_URL:http://localhost:8087/public/payments/cancel?orderId={ORDER_ID}&paymentId={PAYMENT_ID}}"

  idempotency:
    key-prefix: ${PAYMENT_IDEMPOTENCY_KEY_PREFIX:payment}

logging:
  level:
    root: INFO
    com.ecommerce.payment: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
