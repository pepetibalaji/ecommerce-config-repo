message: Payment Service PROD Environment

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

spring:
  application.name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    listener.observation-enabled: true
    template.observation-enabled: true
    consumer:
      group-id: ${PAYMENT_KAFKA_CONSUMER_GROUP_ID:payment-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ecommerce.common.events.*
        spring.json.value.default.type: com.ecommerce.common.events.order.OrderCreatedEvent
        spring.json.use.type.headers: false
    producer:
      client-id: ${PAYMENT_KAFKA_PRODUCER_CLIENT_ID:payment-service-producer}
      acks: all
      retries: ${PAYMENT_KAFKA_PRODUCER_RETRIES:3}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true

grpc.server:
  enabled: true
  port: ${PAYMENT_GRPC_PORT:9092}

payment:
  provider:
    active: ${PAYMENT_PROVIDER_ACTIVE:STRIPE}
    mode: ${PAYMENT_PROVIDER_MODE:live}
    refund-timeout-ms: ${PAYMENT_PROVIDER_REFUND_TIMEOUT_MS:5000}
    sandbox.enabled: ${PAYMENT_SANDBOX_ENABLED:false}
    stripe:
      enabled: ${STRIPE_ENABLED:true}
      api-key: ${STRIPE_API_KEY}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET}
      timeout-ms: ${STRIPE_TIMEOUT_MS:5000}
    razorpay:
      enabled: ${RAZORPAY_ENABLED:false}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      timeout-ms: ${RAZORPAY_TIMEOUT_MS:5000}
  checkout:
    success-url: ${PAYMENT_CHECKOUT_SUCCESS_URL}
    cancel-url: ${PAYMENT_CHECKOUT_CANCEL_URL}
  idempotency.key-prefix: ${PAYMENT_IDEMPOTENCY_KEY_PREFIX:payment}
