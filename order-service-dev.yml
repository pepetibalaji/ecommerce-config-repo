message: Order Service DEV Environment

server:
  port: ${ORDER_SERVICE_PORT:8086}
  shutdown: graceful

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${ORDER_DB_NAME:order_db}
    username: ${POSTGRES_USER:ecommerce_user}
    password: ${POSTGRES_PASSWORD:ecommerce_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    template:
      observation-enabled: true

    producer:
      client-id: ${ORDER_KAFKA_PRODUCER_CLIENT_ID:order-service-producer}
      acks: all
      retries: ${ORDER_KAFKA_PRODUCER_RETRIES:3}
      batch-size: ${ORDER_KAFKA_BATCH_SIZE:16384}
      buffer-memory: ${ORDER_KAFKA_BUFFER_MEMORY:33554432}
      compression-type: ${ORDER_KAFKA_COMPRESSION_TYPE:snappy}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${ORDER_KAFKA_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${ORDER_KAFKA_REQUEST_TIMEOUT_MS:30000}
        linger.ms: ${ORDER_KAFKA_LINGER_MS:5}

grpc:
  server:
    enabled: false

  clients:
    inventory:
      host: ${INVENTORY_GRPC_HOST:localhost}
      port: ${INVENTORY_GRPC_PORT:9091}
      deadline-ms: ${INVENTORY_GRPC_DEADLINE_MS:3000}
      plaintext: ${INVENTORY_GRPC_PLAINTEXT:true}

logging:
  level:
    root: INFO
    com.ecommerce.order: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
