server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db?options=-c%20TimeZone=UTC
    username: ecommerce_user
    password: ecommerce_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8081}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}

  kafka:
    bootstrap-servers: localhost:29092

    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: false

grpc:
  server:
    enabled: false

    clients:
      inventory:
        host: ${INVENTORY_GRPC_HOST:localhost}
        port: ${INVENTORY_GRPC_PORT:9091}
        deadline-ms: 3000
        plaintext: true

  inventory:
    host: localhost
    port: 9091

springdoc:
  swagger-ui:
    path: /swagger-ui.html
