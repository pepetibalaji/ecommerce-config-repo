message: Welcome to Ecommerce Platform DEV Environment

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # ENABLES TRACE CONTEXT PASSING DOWNSTREAM
    propagation:
      consume: [w3c]
      produce: [w3c]
  otlp:
    tracing:
      endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [traceId=%X{traceId}, spanId=%X{spanId}] %logger{36} - %msg%n"

spring:
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    # FIXES SWAGGER FORGETTING JWT TOKEN ON PAGE REFRESH/SERVICE CHANGE
    persist-authorization: true
