message: Auth Service DEV Environment

server:
  port: ${AUTH_SERVICE_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: auth-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

auth:
  authorization-server:
    issuer: ${AUTH_ISSUER_URI:http://localhost:8081}
  internal:
    service-token: ${AUTH_INTERNAL_SERVICE_TOKEN:}
  action-token:
    signing-secret: ${AUTH_ACTION_TOKEN_SIGNING_SECRET:}
  signing-key:
    source: GENERATED
    key-id: auth-dev-ephemeral
    allow-ephemeral: true
  oauth:
    clients: []
  outbox:
    poll-delay-ms: ${AUTH_OUTBOX_POLL_DELAY_MS:1000}
  token:
    access-ttl-minutes: ${AUTH_ACCESS_TOKEN_TTL_MINUTES:30}

logging:
  level:
    root: INFO
    com.ecommerce.auth: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
