message: Inventory Service DEV Environment

server:
  port: ${INVENTORY_SERVICE_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: inventory-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ecommerce.common.events.product,com.ecommerce.common.events.core
        spring.json.use.type.headers: true

  datasource:
    url: ${INVENTORY_DB_URL}
    username: ${INVENTORY_DB_USERNAME}
    password: ${INVENTORY_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

grpc:
  server:
    port: ${INVENTORY_GRPC_PORT:9091}

product-service:
  base-url: ${PRODUCT_SERVICE_URI:http://localhost:8082}

logging:
  level:
    root: INFO
    com.ecommerce.inventory: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
