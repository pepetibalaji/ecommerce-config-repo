message: Product Service DEV Environment

server:
  port: ${PRODUCT_SERVICE_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: product-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

  data:
    mongodb:
      uri: ${PRODUCT_MONGODB_URI}
      database: ${PRODUCT_MONGODB_DATABASE:product_db}

auth:
  internal:
    base-url: ${AUTH_SERVICE_INTERNAL_URL:http://localhost:8081}
    service-token: ${AUTH_INTERNAL_SERVICE_TOKEN:}

product:
  images:
    allowed-hosts: ${PRODUCT_IMAGE_ALLOWED_HOSTS:cdn.example.com}
  outbox:
    poll-delay-ms: ${PRODUCT_OUTBOX_POLL_DELAY_MS:1000}

logging:
  level:
    root: INFO
    com.ecommerce.product: INFO
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
