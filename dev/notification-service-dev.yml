message: Notification Service DEV Environment

server:
  port: ${NOTIFICATION_SERVICE_PORT:8088}
  shutdown: graceful

spring:
  application:
    name: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8081}
  datasource:
    url: ${NOTIFICATION_DB_URL}
    username: ${NOTIFICATION_DB_USERNAME}
    password: ${NOTIFICATION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    listener:
      observation-enabled: true
      ack-mode: record
    consumer:
      group-id: ${NOTIFICATION_KAFKA_CONSUMER_GROUP_ID:notification-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${MAILTRAP_SMTP_HOST}
    port: ${MAILTRAP_SMTP_PORT:2525}
    username: ${MAILTRAP_SMTP_USERNAME}
    password: ${MAILTRAP_SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

notification:
  auth-action-delivery:
    auth-base-url: ${AUTH_INTERNAL_BASE_URL:http://localhost:8081}
    internal-service-token: ${AUTH_INTERNAL_SERVICE_TOKEN:}
    verification-url: ${AUTH_EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
    password-reset-url: ${AUTH_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    email-change-url: ${AUTH_EMAIL_CHANGE_URL:http://localhost:3000/confirm-email-change}
  kafka:
    consumer-group: ${NOTIFICATION_KAFKA_CONSUMER_GROUP_ID:notification-service}
  max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
  retry-base-delay: ${NOTIFICATION_RETRY_BASE_DELAY:30s}
  delivery-poll-ms: ${NOTIFICATION_DELIVERY_POLL_MS:5000}
  provider: ${NOTIFICATION_EMAIL_PROVIDER:mailtrap-sandbox}
  sandbox-from-email: ${MAILTRAP_SANDBOX_FROM_EMAIL:sandbox@ecommerce.local}
  mailtrap:
    api-token: ${MAILTRAP_API_TOKEN:}
    from-email: ${MAILTRAP_FROM_EMAIL:}
    from-name: ${MAILTRAP_FROM_NAME:Ecommerce Platform}
  recipient-email-overrides: {}

management:
  endpoints.web.exposure.include: health,info,prometheus

logging:
  level:
    root: INFO
    com.ecommerce.notification: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
