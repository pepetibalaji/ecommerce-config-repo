message: Cart Service DEV Environment

server:
  port: ${CART_SERVICE_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: cart-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

cart:
  customer:
    ttl: ${CART_CUSTOMER_TTL:7d}
  guest:
    ttl: ${CART_GUEST_TTL:30d}

logging:
  level:
    root: INFO
    com.ecommerce.cart: INFO
    org.springframework.data.redis: INFO
