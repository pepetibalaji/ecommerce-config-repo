server:
  port: ${PRODUCT_SERVICE_PORT:8082}

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${PRODUCT_DB_NAME:product_db}
    username: ${POSTGRES_USER:ecommerce_user}
    password: ${POSTGRES_PASSWORD:ecommerce_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
