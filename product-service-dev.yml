spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/product_db?options=-c%20TimeZone=UTC
    username: ecommerce_user
    password: ecommerce_password

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC

springdoc:
  swagger-ui:
    path: /swagger-ui.html
